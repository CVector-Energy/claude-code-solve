name: CI Rework

# Rely on CI to verify code changes, without trusting the coding agent. If CI fails, then the agent is invoked here to solve the problem.
#
# `uses: ./.github/actions/agent-setup` below resolves against the runner's workspace, which is the CALLER's checkout.
on:
  workflow_call:
    inputs:
      app-id:
        description: GitHub App id whose token the agent acts under.
        required: true
        type: string
      fix-args:
        description: >
          Claude CLI arguments. The agent edits and runs the repository's checks, so unlike triage it needs Bash.
        required: true
        type: string
      git-user-name:
        description: Author name for git commits.
        required: true
        type: string
      git-user-email:
        description: Author email for git commits.
        required: true
        type: string
      allowed-bots:
        description: Comma-separated bot logins whose comments may reach the agent.
        required: false
        type: string
        default: ''
      branch-prefix:
        description: >
          Branch prefix owned by this agent. Checked against the pull request itself; the caller's `workflow_run` branch filter is the cheap check that comes first.
        required: false
        type: string
        default: claude/issue-
      allow-rerun:
        description: >
          Let the agent ask for the failed jobs to be re-run, for a failure no change would fix, such as a rate-limited registry. The agent never holds a token that can re-run anything: it writes a reason to a file, and a later step re-runs exactly this run's failed jobs with a token made only for that. Only on the run's first attempt, because a re-run makes no commit for `max-attempts` to count.
        required: false
        type: boolean
        default: false
      max-attempts:
        description: >
          Maximum number of consecutive reworks an agent may do before giving up. A commit from anyone else resets the count.
        required: false
        type: number
        default: 3
      prompt-template:
        description: >
          Prompt rendered in the caller's workspace.
        required: false
        type: string
        default: .github/prompts/ci-failure.md
      setup:
        description: >
          Whether to call `./.github/actions/agent-setup` in the caller before the agent.
        required: false
        type: boolean
        default: true
      teardown:
        description: >
          Whether to call `./.github/actions/agent-teardown` in the caller once the agent is done.
        required: false
        type: boolean
        default: false
      memory-bucket:
        description: >
          S3 bucket holding the repository's Claude Code auto-memory store. Empty runs the agents without one.
        required: false
        type: string
        default: ''
      memory-role:
        description: >
          IAM role that reads and writes the memory bucket, assumed with the job's OIDC token.
        required: false
        type: string
        default: ''
      inspect-memory:
        description: >
          Log where the auto-memory store actually is, on either side of the agent. A temporary diagnostic for a store whose post-step save fails; see scripts/inspect-memory.sh.
        required: false
        type: boolean
        default: false
      runs-on:
        description: Runner label.
        required: false
        type: string
        default: ubuntu-24.04
    secrets:
      app-private-key:
        description: Private key for the GitHub App.
        required: true
      anthropic-api-key:
        description: Anthropic API key.
        required: true

jobs:
  fix:
    name: Fix CI failure
    runs-on: ${{ inputs.runs-on }}
    if: github.event.workflow_run.conclusion == 'failure'
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - name: Create GitHub App Token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read

      # A workflow_run event names a branch, not a pull request. Nothing to do if the branch has none open, and nothing to do if it is not ours.
      - name: Resolve the pull request
        id: pr
        uses: CVector-Energy/claude-code-solve/resolve-pr@866bb78c8be959f6a7e095533fb0b0e9385c5835
        with:
          github-token: ${{ steps.app.outputs.token }}
          branch-prefix: ${{ inputs.branch-prefix }}

      # Full history, because the agent reads it: the prompt and its `git log` and `git diff` are how it works out what the branch already tried. (The attempt budget is not why — that is counted from the pull request.)
      - name: Checkout the branch that failed
        if: steps.pr.outputs.exists == 'true' && steps.pr.outputs.managed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.branch }}
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up the caller's toolchain
        if: >
          inputs.setup && steps.pr.outputs.exists == 'true' &&
          steps.pr.outputs.managed == 'true'
        uses: ./.github/actions/agent-setup

      - name: Fix the CI failure
        id: fix
        if: steps.pr.outputs.exists == 'true' && steps.pr.outputs.managed == 'true'
        uses: CVector-Energy/claude-code-solve/fix-ci@866bb78c8be959f6a7e095533fb0b0e9385c5835
        with:
          pr-number: ${{ steps.pr.outputs.number }}
          branch: ${{ steps.pr.outputs.branch }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ steps.app.outputs.token }}
          anthropic-api-key: ${{ secrets.anthropic-api-key }}
          claude-args: ${{ inputs.fix-args }}
          max-attempts: ${{ inputs.max-attempts }}
          prompt-template: ${{ inputs.prompt-template }}
          allowed-bots: ${{ inputs.allowed-bots }}
          show-full-output: true
          git-user-name: ${{ inputs.git-user-name }}
          git-user-email: ${{ inputs.git-user-email }}
          memory-bucket: ${{ inputs.memory-bucket }}
          memory-role: ${{ inputs.memory-role }}
          inspect-memory: ${{ inputs.inspect-memory }}
          allow-rerun: ${{ inputs.allow-rerun && github.event.workflow_run.run_attempt == 1 }}

      - name: Create a token that can re-run the failed jobs
        id: rerun-app
        if: >
          steps.pr.outputs.exists == 'true' && steps.pr.outputs.managed == 'true' &&
          inputs.allow-rerun && github.event.workflow_run.run_attempt == 1 &&
          steps.fix.outputs.rerun-requested == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write

      - name: Re-run the failed jobs
        id: rerun
        if: >
          steps.pr.outputs.exists == 'true' && steps.pr.outputs.managed == 'true' &&
          steps.rerun-app.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.rerun-app.outputs.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --failed --repo "$REPO"

      # A cancelled job is closed, but a failed one still uses orderly tear-down.
      - name: Tear down the caller's toolchain
        if: >
          !cancelled() && inputs.teardown &&
          steps.pr.outputs.exists == 'true' && steps.pr.outputs.managed == 'true'
        uses: ./.github/actions/agent-teardown
